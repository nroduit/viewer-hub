<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1076" style="width:100%;max-width:1536px;height:auto;display:block;margin:0 auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="vh-title vh-desc">
<title id="vh-title">Viewer-Hub architecture</title>
<desc id="vh-desc">Clients launch Weasis, OHIF, 3D Slicer or MicroDicom through Viewer-Hub. Viewer-Hub selects the viewer and builds XML or JSON manifests. Its database, DICOM and DICOMweb connectors reach the PACS archives. OHIF, 3D Slicer and MicroDicom retrieve images through the Viewer-Hub Gateway that routes to the PACS archives, while Weasis queries the PACS directly using its manifest. An identity provider, PostgreSQL, Redis, Bucket S3 and Nexus are internal services of Viewer-Hub, along with the Config Server.</desc>
