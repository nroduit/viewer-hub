# - Info
info:
  component: viewer-hub
  app:
    name: viewer-hub
    description: Viewer Hub
  environment: ${ENVIRONMENT}

# - Spring
spring:
  application:
    name: viewer-hub
    version: '@project.version@'
  profiles:
    # Profiles available to switch between: dicom / dicom web or with or without gateway: connectors-dicom-gtw, connectors-dicom-no-gtw, connectors-dicomweb-gtw
    active: oidc, connectors-dicom-no-gtw, environment-override, package, cryptography, ohif, weasis, slicer, microdicom
  cloud:
    aws:
      # Region
      region:
        static: eu-west-1
      s3:
        path-style-access-enabled: true # Used for s3 resources
        endpoint: ${S3_ENDPOINT}
        bucket:
          name: ${S3_BUCKET_NAME}
      # Aws Credentials (set here because of default aws s3 resource loader)
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
    config:
      discovery:
        enabled: false
      fail-fast: true
      name: ${spring.application.name}
      label: ${ENVIRONMENT}
      uri: ${CONFIGSERVER_URI}
  config:
    import: 'configserver:'
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: 'jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}'
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: viewer-hub
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 270000 # 4 minutes 30 secondes
      validation-timeout: 3000
      connection-test-query: SELECT 1
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
#    In order to still use the unique hibernate_sequence, otherwise we should create a sequence table_name_seq for
#  each tables
  jpa:
    properties:
      hibernate:
        id:
          db_structure_naming_strategy: legacy

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  codec:
    max-in-memory-size: 10MB

# - Logs
logging:
  level:
    org:
      viewer: INFO
    # Copilot's release-note fetch fails behind TLS-inspecting proxies (PKIX path
    # building failed). The call is cosmetic, so silence its logger to drop the
    # noisy stack trace.
    com.vaadin.copilot.VersionReleaseNoteHandler: "OFF"

# - Vaadin
# Dev-mode Copilot (Vaadin dev tools) is disabled: its release-note/version check
# calls out to the internet and, behind a TLS-inspecting proxy, throws an SSL
# handshake (PKIX) error. Copilot is a dev-only tool and unused here.
vaadin:
  copilot:
    enable: false

# - Timeout
timeout:
  dicom-web: 90 # Timeout 90 seconds

# - Eureka
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}

# - Viewer-hub
viewer-hub:
  # - Server Url
  server:
    url: ${BACKEND_URI}
  # - Resources package in s3
  resources-packages:
    weasis:
      path: '${viewer-hub.resources-packages.path}/weasis'
      package:
        path: '${viewer-hub.resources-packages.path}/weasis/package'
      i18n:
        path: '${viewer-hub.resources-packages.path}/weasis/i18n'
      mapping-minimal-version:
        path: '${viewer-hub.resources-packages.path}/weasis/mapping-minimal-version.json'
    # - Cleanup of obsolete immutable build-stamped sub-directories (<version>/<buildId>).
    #   A re-uploaded version publishes a new build id; the previous build is kept during the
    #   grace period (measured from the last publish) so clients pinned to it can finish
    #   downloading, then removed by the scheduled BuildRetentionService.
    build-retention:
      enabled: true
      grace-period: PT24H

server:
# Enable response compression: currently not working
  compression:
    enabled: true
  # The comma-separated list of mime types that should be compressed
    mime-types: application/xml #  text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
#    min-response-size: 1000000 # => 1 Mo : currently not working as response is chunk encoded and no content-length is sent
  use-relative-redirects: true

