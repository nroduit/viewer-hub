name: viewer-hub

services:

  # Postgres SQL
  viewer-hub-db:
    image: postgres:17.10-alpine
    container_name:  viewer-hub_db
    ports:
      - "45101:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U viewer-hub -d viewer-hub" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey cache (Redis-compatible) used to store the Weasis manifests
  viewer-hub-cache:
    container_name: viewer-hub_cache
    image: valkey/valkey:9.0.4-alpine
    command: valkey-server --save "" --appendonly no # Pure cache: no persistence
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Minio for using S3 cloud storage API minio:latest
  minio-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: viewer-hub_minio
    command: server --console-address ":9090" /resources
    ports:
      - "9080:9000"
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # Nexus used to store the package versions of Weasis
  nexus:
    image: sonatype/nexus3:3.78.0-alpine
    ports:
      - "8086:8081"
      - "8087:8085"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s