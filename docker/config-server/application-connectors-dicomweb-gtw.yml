#  - Connectors
connector:
  # If value is present: use the connectors specified, if not present or wrong connector ids: use all the connectors
  # defined in the config
  default: dcm4chee-local # connectorId1, connectorId2

  # Limit the dicom-web connector when retrieving metadata
  dicom-web-level-limit: # STUDY, SERIE

  # Connectors configuration
  config:

    # ------------------------------------------------------------------
    # ---- DCM4CHEE PACS: dicom-web connector using secured gateway ----
    # ------------------------------------------------------------------
    dcm4chee-local:
      type: DICOM_WEB # DB,DICOM,DICOM_WEB
      # ------- Search Criteria ----
      search-criteria:
        deactivated: # SOP_INSTANCE_UID, SERIE_INSTANCE_UID, STUDY_INSTANCE_UID, STUDY_ACCESSION_NUMBER, PATIENT_ID
      # ----------  Weasis - Manifest -------
      weasis:
        manifest:
          transfer-syntax-uid: '*'
      # --------   For dicom web ----------
      dicom-web-connector:
        # ----------   Qido -------------
        # Used to retrieve images from criterias
        qido-rs:
          authentication:
            # Type: BASIC, OAUTH2
            type: OAUTH2
            # Retrieve the token from oidc config (if authorization_code flow, request should be authenticated, otherwise use BASIC authentication) and inject it in the manifest for Weasis to get the images
            oauth2:
              oidc-id: keycloak
              # Url used to retrieve images by adding token in manifest
              server:
                url: http://localhost
                port: 8088
                context: /DCM4CHEE-LOCAL/rs
            # Retrieve the images by using this basic authentication parameters
            basic:
              # Basic credentials
              login: toChange
              password: toChange
              # Url used to retrieve images by using basic authentication
              server:
                url: http://localhost
                port: 8080
                context: /dcm4chee-arc/aets/DCM4CHEE/wado
        # ----------   Qido -------------
        # Used to retrieve images from criterias
        wado-rs:
          authentication:
            # Type: BASIC, OAUTH2
            type: OAUTH2
            # Retrieve the token from oidc config (if authorization_code flow, request should be authenticated, otherwise use BASIC authentication) and inject it in the manifest for Weasis to get the images
            oauth2:
              oidc-id: keycloak
              # Url used to retrieve images by adding token in manifest
              server:
                url: http://localhost
                port: 8088
                context: /DCM4CHEE-LOCAL/rs
            # Retrieve the images by using this basic authentication parameters
            basic:
              # Basic credentials
              login: toChange
              password: toChange
              # Url used to retrieve images by using basic authentication
              server:
                url: http://localhost
                port: 8080
                context: /dcm4chee-arc/aets/DCM4CHEE/wado

    # ------------------------------------------------------------------
    # ---- ORTHANC PACS: dicom_web connector using secured gateway -----
    # ------------------------------------------------------------------
    orthanc-local:
      type: DICOM_WEB # DB,DICOM,DICOM_WEB
      # ------- Search Criteria ----
      search-criteria:
        deactivated: # SOP_INSTANCE_UID, SERIE_INSTANCE_UID, STUDY_INSTANCE_UID, STUDY_ACCESSION_NUMBER, PATIENT_ID
      # ----------  Weasis - Manifest -------
      weasis:
        manifest:
          transfer-syntax-uid: '*'
      # --------   For dicom web ----------
      dicom-web-connector:
        # ----------   Qido -------------
        # Used to retrieve images from criterias
        qido-rs:
          authentication:
            # Type: BASIC, OAUTH2
            type: OAUTH2
            # Retrieve the token from oidc config (if authorization_code flow, request should be authenticated, otherwise use BASIC authentication) and inject it in the manifest for Weasis to get the images
            oauth2:
              oidc-id: keycloak
              # Url used to retrieve images by adding token in manifest
              server:
                url: http://localhost
                port: 8088
                context: /ORTHANC-LOCAL/dicomweb
            # Retrieve the images by using this basic authentication parameters
            basic:
              # Basic credentials
              login: orthanc-user
              password: password
              # Url used to retrieve images by using basic authentication
              server:
                url: http://localhost
                port: 8042
                context: /dicomweb
        # ----------   Qido -------------
        # Used to retrieve images from criterias
        wado-rs:
          authentication:
            # Type: BASIC, OAUTH2
            type: OAUTH2
            # Retrieve the token from oidc config (if authorization_code flow, request should be authenticated, otherwise use BASIC authentication) and inject it in the manifest for Weasis to get the images
            oauth2:
              oidc-id: keycloak
              # Url used to retrieve images by adding token in manifest
              server:
                url: http://localhost
                port: 8088
                context: /ORTHANC-LOCAL/dicomweb
            # Retrieve the images by using this basic authentication parameters
            basic:
              # Basic credentials
              login: orthanc-user
              password: password
              # Url used to retrieve images by using basic authentication
              server:
                url: http://localhost
                port: 8042
                context: /dicomweb

