name: dcm4chee-local

services:

  # Ldap: dcm4chee configuration
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.10-34.3
    container_name: dcm4chee_ldap
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "389:389"
    environment:
      STORAGE_DIR: /storage/fs1
      IID_STUDY_URL: ${IID_STUDY_URL}
      IID_PATIENT_URL: ${IID_PATIENT_URL}
      IID_URL_TARGET: _self
    volumes:
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "389" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Postgres SQL for dcm4chee
  db:
    image: dcm4che/postgres-dcm4chee:17.4-34
    container_name: dcm4chee_db
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pacs -d pacsdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dcm4chee web portal
  arc:
    image: dcm4che/dcm4chee-arc-psql:5.34.3
    container_name: dcm4chee
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9990:9990"
      - "9993:9993"
      - "11112:11112"
      - "2762:2762"
      - "2575:2575"
      - "12575:12575"
    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:5432
      WILDFLY_ADMIN_USER: root
      WILDFLY_ADMIN_PASSWORD: changeit
    depends_on:
      ldap:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/wildfly:/opt/wildfly/standalone
      - /var/local/dcm4chee-arc/storage:/storage
    healthcheck:
      # WildFly HTTP listener up = archive deployed; TCP probe avoids guessing an endpoint
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080" ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  ldap_data:
  ldap_config: