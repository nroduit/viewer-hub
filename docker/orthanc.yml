name: orthanc-local

services:
  orthanc:
    image: jodogne/orthanc-plugins:1.12.6
    container_name: orthanc
    command: /run/secrets/  # Path to the configuration files (stored as secrets)
    ports:
      - 4242:4242
      - 8042:8042
    secrets:
      - orthanc.json
    volumes:
      - ./orthanc/plugin/Build/libOrthancViewerHub.so.mainline:/usr/local/share/orthanc/plugins/libOrthancViewerHub.so
secrets:
  orthanc.json:
    file: orthanc/orthanc.json
    