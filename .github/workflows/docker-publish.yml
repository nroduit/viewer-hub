name: Docker publish
permissions:
  contents: read
# Publishing only ever happens for the canonical history: pushes to main and
# version tags. Pull requests and feature branches never build or push an image.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The multi-stage Dockerfile builds the Spring Boot jar itself (Maven + Temurin 25),
      # so the runner only needs Docker/Buildx — no JDK, Node or Maven setup here.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: nroduit/viewer-hub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
